[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-mpmc-queue"
version = "0.1.0"
description = "A Python Michael-Scott MPMC queue using native atomic CAS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["atomics>=1.0.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
faulthandler_timeout = 300
markers = ["stress: concurrent producer/consumer stress tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
